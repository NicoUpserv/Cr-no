<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Bandeau de correspondance — fiche élève</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#F2F2F2;color:#111;font:17px/1.3 -apple-system,Roboto,system-ui,sans-serif}
.band{background:#FFD100;padding:54px 16px 14px}
.band .top{display:flex;justify-content:space-between;font-size:15px;font-weight:600}
.band .big{display:flex;align-items:center;gap:12px;margin-top:10px}
.pict{width:44px;height:44px;background:#111;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:700}
.time{font-size:52px;font-weight:800;letter-spacing:-1px;line-height:1}
.dest{font-size:17px;font-weight:600}
.dest small{display:block;font-size:15px;font-weight:400}
.arrow{margin-left:auto;font-size:34px;font-weight:800}
h1{font-size:30px;font-weight:700;padding:18px 16px 2px}
.meta{padding:0 16px 12px;color:#555;font-size:15px}
.sec{padding:16px 16px 6px;font-size:13px;color:#666;text-transform:uppercase;letter-spacing:.6px}
.group{margin:0 16px;background:#fff;border-radius:12px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:.5px solid #DDD;font-size:16px}
.row:last-child{border-bottom:0}
.row small{display:block;color:#666;font-size:14px}
.bar{height:6px;border-radius:3px;background:#E5E5E5;margin-top:6px;width:200px;overflow:hidden}.bar i{display:block;height:100%;width:58%;background:#111}
.warn{color:#9A5B00;font-weight:600}
.tab{position:absolute;bottom:0;left:0;right:0;height:84px;background:#fff;border-top:.5px solid #DDD;display:flex;justify-content:space-around;padding-top:8px;font-size:11px;color:#888}
.tab .on{color:#111}.tab div{text-align:center}.tab i{display:block;width:26px;height:22px;margin:0 auto 3px;border-radius:6px;background:currentColor;opacity:.25}.tab .on i{opacity:1}
</style></head><body>
<div class="band">
  <div class="top"><span>‹ Élèves</span><span>Prochaine étape</span></div>
  <div class="big"><div class="pict">L</div><div class="time">14:00</div><div class="dest">Gare d'Aix-TGV<small>dans 35 min · Lina</small></div><div class="arrow">→</div></div>
</div>
<h1>Lina Morel</h1>
<div class="meta">Permis B · Leçon 14 / 20</div>
<div class="sec">Progression</div>
<div class="group">
  <div class="row"><div>Compétence 3 en cours<div class="bar"><i></i></div></div><span>›</span></div>
  <div class="row"><div class="warn">Cours non consulté<small>Insertion sur voie rapide</small></div><span>›</span></div>
</div>
<div class="sec">Dossier</div>
<div class="group"><div class="row"><div>Pièces<small>2 documents manquants</small></div><span>›</span></div><div class="row"><div>Observations</div><span>›</span></div><div class="row"><div>Livret</div><span>›</span></div></div>
<div class="tab"><div class="on"><i></i>Aujourd'hui</div><div><i></i>Élèves</div><div><i></i>Planning</div><div><i></i>Parcours</div><div><i></i>Plus</div></div>
</body></html>
