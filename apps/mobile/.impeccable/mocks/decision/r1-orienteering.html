<style>
:root{--purple:#9B2D8F;--yellow:#F7E27A;--green:#9DBA6B;--brown:#8C5A2B;--blue:#3D8BC9}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#fff;color:#1E1E1E;font:17px/1.3 -apple-system,Roboto,system-ui,sans-serif}
.status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-weight:600;font-size:16px}
.nav{display:flex;justify-content:space-between;padding:6px 16px;color:var(--purple)}
h1{font-size:34px;font-weight:700;padding:2px 16px 0}
.meta{padding:2px 16px 12px;color:#666;font-size:15px}
.map{margin:0 16px;height:220px;border-radius:12px;position:relative;overflow:hidden;background:#fff;border:1px solid #DDD}
.map .open{position:absolute;left:0;top:0;width:55%;height:60%;background:var(--yellow);opacity:.7}
.map .wood{position:absolute;right:0;bottom:0;width:60%;height:55%;background:var(--green);opacity:.55}
.map svg{position:absolute;inset:0}
.legend{margin:10px 16px 0;font-size:14px}
.legend div{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:.5px solid #EEE}
.legend b{color:var(--purple);width:22px}
.sec{padding:16px 16px 6px;font-size:13px;color:#666;text-transform:uppercase;letter-spacing:.6px}
.group{margin:0 16px;background:#F6F6F6;border-radius:12px;overflow:hidden}
.row{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:.5px solid #E5E5E5;font-size:16px}
.row:last-child{border-bottom:0}.row small{display:block;color:#666;font-size:14px}
.tab{position:absolute;bottom:0;left:0;right:0;height:84px;background:#fff;border-top:.5px solid #DDD;display:flex;justify-content:space-around;padding-top:8px;font-size:11px;color:#999}
.tab .on{color:var(--purple)}.tab div{text-align:center}.tab i{display:block;width:26px;height:22px;margin:0 auto 3px;border-radius:6px;background:currentColor;opacity:.25}.tab .on i{opacity:1}
</style></head><body>
